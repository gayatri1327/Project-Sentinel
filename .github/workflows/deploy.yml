# =============================================================================
# Sentinel Deploy — Production Deployment to Vercel
# =============================================================================
# Triggered ONLY on push to `main` (not PRs) AND only after CI passes.
#
# Required GitHub Secrets (Settings → Secrets → Actions):
#   VERCEL_TOKEN       — from vercel.com/account/tokens
#   VERCEL_ORG_ID      — from .vercel/project.json after `vercel link`
#   VERCEL_PROJECT_ID  — from .vercel/project.json after `vercel link`
#
# Setup steps (one-time):
#   1. npm i -g vercel
#   2. cd sentinel/app && vercel link   (follow prompts, saves .vercel/project.json)
#   3. Copy VERCEL_ORG_ID + VERCEL_PROJECT_ID from .vercel/project.json
#   4. Create VERCEL_TOKEN at vercel.com/account/tokens
#   5. Add all 3 as GitHub repo secrets
#
# Environment variables set in Vercel dashboard (not here):
#   NODE_ENV=production
# =============================================================================

name: Sentinel Deploy

on:
  push:
    branches: [main]
  # Also allow manual trigger from GitHub Actions UI
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "production"
        type: choice
        options: [production, preview]

# Only one deploy at a time — queue instead of cancel
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  NODE_VERSION: "20"

jobs:
  # ── Pre-deploy: run CI checks inline (fast gate) ─────────────────────────────
  pre-deploy-check:
    name: Pre-deploy Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dashboard dependencies
        working-directory: app
        run: npm ci

      - name: Verify Next.js builds successfully
        working-directory: app
        run: npm run build
        env:
          NODE_ENV: production

      - name: Run auth-service tests
        working-directory: services/auth-service
        run: |
          npm ci
          npm test -- --forceExit --passWithNoTests
        env:
          NODE_ENV: test

      - name: Run data-service tests
        working-directory: services/data-service
        run: |
          npm ci
          npm test -- --forceExit --passWithNoTests
        env:
          NODE_ENV: test

      - name: Run notify-service tests
        working-directory: services/notify-service
        run: |
          npm ci
          npm test -- --forceExit --passWithNoTests
        env:
          NODE_ENV: test

  # ── Deploy to Vercel Production ───────────────────────────────────────────────
  deploy-production:
    name: Deploy → Vercel Production
    runs-on: ubuntu-latest
    needs: pre-deploy-check
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      # Pull Vercel project settings (reads VERCEL_ORG_ID + VERCEL_PROJECT_ID)
      - name: Pull Vercel environment info
        working-directory: app
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID:     ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      # Build using Vercel's build system (respects vercel.json overrides)
      - name: Build with Vercel
        working-directory: app
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID:     ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      # Deploy the pre-built output
      - name: Deploy to Vercel Production
        id: deploy
        working-directory: app
        run: |
          url=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$url" >> $GITHUB_OUTPUT
          echo "🚀 Deployed to: $url"
        env:
          VERCEL_ORG_ID:     ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      # Post deployment URL as a commit status
      - name: Create deployment summary
        run: |
          echo "## 🚀 Sentinel Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field       | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-------------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Environment | Production |" >> $GITHUB_STEP_SUMMARY
          echo "| URL         | ${{ steps.deploy.outputs.url }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit      | ${{ github.sha }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Triggered by| ${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Branch      | ${{ github.ref_name }} |" >> $GITHUB_STEP_SUMMARY

  # ── Post-deploy: smoke test the live URL ─────────────────────────────────────
  post-deploy-smoke:
    name: Post-Deploy Smoke Test
    runs-on: ubuntu-latest
    needs: deploy-production

    steps:
      - name: Wait for deployment to propagate
        run: sleep 15

      - name: Check /api/status endpoint
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "${{ needs.deploy-production.outputs.url }}/api/status")
          if [ "$STATUS" != "200" ]; then
            echo "❌ /api/status returned $STATUS"
            exit 1
          fi
          echo "✅ /api/status → 200 OK"

      - name: Check /api/post-mortem endpoint
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "${{ needs.deploy-production.outputs.url }}/api/post-mortem")
          echo "POST-MORTEM status: $STATUS"
          # Non-blocking — post-mortem may return 500 if log files don't exist in prod
